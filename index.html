<!DOCTYPE html>
<html>
<head>
<title>Lua Obfuscator by joyful_pizzapartyl</title>
<meta charset="UTF-8">
<style>
body {
    background:#0b0b0b;
    color:#0f0;
    font-family: monospace;
    padding:20px;
}
textarea {
    width:100%;
    height:200px;
    background:#000;
    color:#0f0;
    border:1px solid #0f0;
    padding:10px;
}
button {
    background:#000;
    color:#0f0;
    border:1px solid #0f0;
    padding:10px 20px;
    cursor:pointer;
}
button:hover { background:#0f0; color:#000; }
</style>
</head>

<body>

<h2>Lua Obfuscator (by you know who)</h2>

<textarea id="input" placeholder="Paste Lua script here..."></textarea>
<br><br>
<button onclick="obfuscate()">Obfuscate</button>
<br><br>
<textarea id="output" placeholder="Obfuscated code appears here"></textarea>

<script>
function obfuscate() {
    let src = document.getElementById("input").value;
    if (!src) return alert("Paste Lua code!");

    let OFFSET = 19;
    let XOR = 7;
    let CHUNK = 24;

    // encode bytes
    let enc = [];
    for (let i = 0; i < src.length; i++) {
        let b = src.charCodeAt(i);
        b = (b ^ XOR) + OFFSET;
        enc.push(b);
    }

    // build Lua obfuscated script
    let out = [];
    out.push("do");
    out.push("local _p=print local _l=loadstring or load");
    out.push("local function _die() while true do end end");
    out.push("if _p~=print then _die() end");

    // junk
    out.push("local _junk={} for i=1,50 do _junk[i]=function() return math.random() end end");
    out.push("if math.random()<0 then _junk[1]() end");

    // data
    out.push("local _d={" + enc.join(",") + "}");

    // decoder (no full string stored)
    out.push(`
local _buf={}
local function _emit(c)
    _buf[#_buf+1]=string.char(c)
    if #_buf>${CHUNK} then
        _l(table.concat(_buf))()
        table.clear(_buf)
    end
end

for i=1,#_d do
    local b=_d[i]
    b=b-${OFFSET}
    b=b~${XOR}
    _emit(b)
end

if #_buf>0 then
    _l(table.concat(_buf))()
end
`);

    out.push("end");

    document.getElementById("output").value = out.join("\n");
}
</script>

</body>
</html>
