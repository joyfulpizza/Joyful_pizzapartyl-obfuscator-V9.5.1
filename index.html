<script>
function obfuscate() {
    var src = document.getElementById("input").value;
    if (!src) { alert("Paste Lua code first"); return; }

    var OFFSET = 19;
    var XOR = 7;
    var CHUNK = 64;

    // encode
    var enc = [];
    for (var i = 0; i < src.length; i++) {
        var b = src.charCodeAt(i);
        b = (b ^ XOR) + OFFSET;
        enc.push(b);
    }

    var out = [];
    function w(s){ out.push(s); }

    // lua output
    w("-- obfuscated by joyful_pizzapartyl obfuscator");
    w("do");
    w("local _L = loadstring or load");
    w("local _DATA = {" + enc.join(",") + "}");
    w("local _OFFSET = " + OFFSET);
    w("local _XOR = " + XOR);
    w("local _CHUNK = " + CHUNK);
    w("local _b = {}");

    w("local function _emit(c)");
    w("  _b[#_b+1] = string.char(c)");
    w("  if #_b >= _CHUNK then");
    w("    _L(table.concat(_b))()");
    w("    for i=1,#_b do _b[i]=nil end");
    w("  end");
    w("end");

    w("for i=1,#_DATA do");
    w("  local x = _DATA[i]");
    w("  x = x - _OFFSET");
    w("  x = x ~ _XOR");
    w("  _emit(x)");
    w("end");

    w("if #_b > 0 then _L(table.concat(_b))() end");
    w("end");

    document.getElementById("output").value = out.join("\n");
}
